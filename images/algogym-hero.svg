<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AlgoGym repository hero image</title>
  <desc id="desc">A professional coding workspace banner for C++ and JavaScript problem solving with shared input and output panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101418"/>
      <stop offset="0.55" stop-color="#151B20"/>
      <stop offset="1" stop-color="#1C2025"/>
    </linearGradient>
    <linearGradient id="panel" x1="160" y1="138" x2="1120" y2="618" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202830"/>
      <stop offset="1" stop-color="#11171D"/>
    </linearGradient>
    <filter id="shadow" x="118" y="96" width="1044" height="564" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#050608" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 618H1280" stroke="#2E363D" stroke-width="2"/>
  <path d="M88 142C202 84 314 78 424 124C530 168 635 171 740 132C854 89 984 94 1192 166" stroke="#2A343A" stroke-width="2" opacity="0.5"/>
  <path d="M84 578C216 524 354 520 498 566C632 609 754 604 864 550C972 497 1088 500 1212 558" stroke="#223033" stroke-width="2" opacity="0.55"/>

  <g opacity="0.8">
    <circle cx="198" cy="144" r="5" fill="#39C6A3"/>
    <circle cx="316" cy="106" r="5" fill="#F2B84B"/>
    <circle cx="464" cy="156" r="5" fill="#8DD7F7"/>
    <path d="M198 144L316 106L464 156" stroke="#42505A" stroke-width="2"/>
    <circle cx="940" cy="132" r="5" fill="#8DD7F7"/>
    <circle cx="1038" cy="104" r="5" fill="#39C6A3"/>
    <circle cx="1130" cy="152" r="5" fill="#F2B84B"/>
    <path d="M940 132L1038 104L1130 152" stroke="#42505A" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="140" y="132" width="1000" height="488" rx="18" fill="url(#panel)" stroke="#34414A"/>
    <rect x="140" y="132" width="1000" height="54" rx="18" fill="#222B33"/>
    <path d="M140 186H1140" stroke="#34414A"/>
    <circle cx="178" cy="159" r="7" fill="#F26B5E"/>
    <circle cx="204" cy="159" r="7" fill="#F2B84B"/>
    <circle cx="230" cy="159" r="7" fill="#39C6A3"/>

    <text x="640" y="167" text-anchor="middle" fill="#DCE5EA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">AlgoGym</text>
    <text x="640" y="214" text-anchor="middle" fill="#91A3AE" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Train problem solving with C++ and JavaScript</text>

    <rect x="184" y="248" width="548" height="288" rx="12" fill="#111820" stroke="#2E3A43"/>
    <rect x="768" y="248" width="316" height="122" rx="12" fill="#141C23" stroke="#31404A"/>
    <rect x="768" y="414" width="316" height="122" rx="12" fill="#141C23" stroke="#31404A"/>

    <text x="216" y="282" fill="#8DD7F7" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="18">main.cpp</text>
    <text x="800" y="282" fill="#F2B84B" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="18">input.txt</text>
    <text x="800" y="446" fill="#39C6A3" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="18">output.txt</text>

    <g font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="18">
      <text x="216" y="326" fill="#6A7882">01</text>
      <text x="268" y="326" fill="#DCE5EA">long long solve(vector&lt;long long&gt; a) {</text>
      <text x="216" y="362" fill="#6A7882">02</text>
      <text x="268" y="362" fill="#91A3AE">  long long sum = 0;</text>
      <text x="216" y="398" fill="#6A7882">03</text>
      <text x="268" y="398" fill="#DCE5EA">  for (auto x : a) sum += x;</text>
      <text x="216" y="434" fill="#6A7882">04</text>
      <text x="268" y="434" fill="#91A3AE">  return sum;</text>
      <text x="216" y="470" fill="#6A7882">05</text>
      <text x="268" y="470" fill="#DCE5EA">}</text>
    </g>

    <g font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="18">
      <text x="800" y="322" fill="#DCE5EA">5</text>
      <text x="800" y="350" fill="#91A3AE">1000000001 ...</text>
      <text x="800" y="486" fill="#DCE5EA">5000000015</text>
    </g>

    <rect x="184" y="558" width="900" height="30" rx="8" fill="#0E141A" stroke="#2B363E"/>
    <text x="216" y="579" fill="#91A3AE" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15">Problem runner finished</text>
    <text x="470" y="579" fill="#39C6A3" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15">Language: C++</text>
    <text x="682" y="579" fill="#F2B84B" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15">Runtime: 0.004s</text>
  </g>

  <g opacity="0.9">
    <rect x="104" y="272" width="18" height="18" rx="4" fill="#39C6A3"/>
    <rect x="1148" y="452" width="18" height="18" rx="4" fill="#F2B84B"/>
    <path d="M92 460H142M117 435V485" stroke="#495861" stroke-width="3" stroke-linecap="round"/>
    <path d="M1144 278H1192M1168 254V302" stroke="#495861" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
